<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0c0f">
  <title>VFX Cook Academy — Cinematic AI, taught like film</title>
  <meta name="description" content="Learn to direct cinematic AI video in Malayalam. The learning module of brahmastra.studio, taught by the filmmakers behind VFX Cook.">
  <link rel="icon" type="image/png" href="/brand/logo-mark.png">
  <link rel="apple-touch-icon" href="/brand/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Bebas+Neue&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html,body{height:100%;margin:0;background:#0b0c0f;color:#f4f4f6}
    #root{min-height:100%}

    .boot{
      --boot-bg:#0b0c0f;--boot-text:#f4f4f6;--boot-accent:#e60175;--boot-ember:#ff8a4c;
      --boot-muted:rgba(244,244,246,.58);--boot-faint:rgba(244,244,246,.12);
      --boot-ease:cubic-bezier(.2,0,0,1);
      position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;
      padding:24px 16px;background:var(--boot-bg);color:var(--boot-text);overflow:hidden;isolation:isolate;
    }
    .boot::before{
      content:"";position:absolute;left:50%;top:46%;width:min(70vw,720px);aspect-ratio:1;z-index:-1;
      transform:translate(-50%,-50%);pointer-events:none;
      background:radial-gradient(circle,rgba(230,1,117,.1),transparent 62%);
      animation:boot-breathe 4.8s ease-in-out infinite;
    }
    .boot-card{position:relative;width:min(420px,100%);display:grid;gap:14px;justify-items:center;text-align:center}

    .boot-emblem{position:relative;width:112px;height:112px;display:grid;place-items:center;margin-bottom:8px;animation:boot-in 520ms var(--boot-ease) both}
    .boot-aperture{position:absolute;inset:0;border-radius:50%;border:1px dashed var(--boot-faint);animation:boot-spin 24s linear infinite}
    .boot-aperture::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--boot-accent);animation:boot-spin 1.6s var(--boot-ease) infinite}
    .boot-mark{position:relative;width:58px;height:58px;background:url('/brand/logo-mark.png') center/contain no-repeat}
    .boot-sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%) 0 0/300% 100% no-repeat;mix-blend-mode:soft-light;animation:boot-sheen 2.8s var(--boot-ease) infinite}

    .boot-word{display:inline-flex;font:400 32px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.2em;margin-right:-.2em;text-transform:uppercase}
    .boot-word span{display:inline-block;animation:boot-letter 560ms var(--boot-ease) both;animation-delay:calc(160ms + var(--i,0) * 42ms)}
    .boot-word .is-hot{color:var(--boot-ember)}
    .boot-sub{color:var(--boot-muted);font:400 13px/20px "Inter Tight",system-ui,sans-serif;letter-spacing:.02em;animation:boot-in 520ms var(--boot-ease) 520ms both}
    .boot-bar{position:relative;width:196px;height:2px;border-radius:2px;background:var(--boot-faint);overflow:hidden}
    .boot-bar i{position:absolute;inset:0 auto 0 0;width:38%;border-radius:inherit;background:linear-gradient(90deg,var(--boot-ember),var(--boot-accent));animation:boot-slide 1.4s var(--boot-ease) infinite}
    .boot-meta{font:500 10.5px/16px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,244,246,.34)}

    @keyframes boot-slide{0%{transform:translateX(-100%)}100%{transform:translateX(265%)}}
    @keyframes boot-spin{to{transform:rotate(360deg)}}
    @keyframes boot-breathe{0%,100%{opacity:.7}50%{opacity:1}}
    @keyframes boot-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes boot-letter{from{opacity:0;transform:translateY(55%)}to{opacity:1;transform:none}}
    @keyframes boot-sheen{0%,40%{background-position:100% 0}72%,100%{background-position:0 0}}

    @media(prefers-reduced-motion:reduce){
      .boot *,.boot::before{animation:none!important;transition:none!important}
      .boot-sheen{display:none}
      .boot-bar i{width:62%;opacity:.85}
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BphKQwbS.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DnbWY5NF.css">
</head>
<body>
  <div id="root">
    <div class="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-emblem" aria-hidden="true">
          <span class="boot-aperture"></span>
          <div class="boot-mark"><i class="boot-sheen"></i></div>
        </div>
        <b class="boot-word" aria-label="VFX Cook Academy">
          <span aria-hidden="true" style="--i:0">V</span><span aria-hidden="true" style="--i:1">F</span><span aria-hidden="true" style="--i:2">X</span><span aria-hidden="true" style="--i:3">&nbsp;</span><span aria-hidden="true" style="--i:4" class="is-hot">C</span><span aria-hidden="true" style="--i:5" class="is-hot">O</span><span aria-hidden="true" style="--i:6" class="is-hot">O</span><span aria-hidden="true" style="--i:7" class="is-hot">K</span>
        </b>
        <span class="boot-sub">Rolling the Academy…</span>
        <div class="boot-bar" aria-hidden="true"><i></i></div>
        <small class="boot-meta" aria-hidden="true">A module of brahmastra.studio</small>
      </div>
    </div>
  </div>

</body>
</html>
